<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>cleanMac</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
      <main class="main">
        <header class="toolbar" id="toolbar"></header>
        <section class="view" id="view" tabindex="-1"></section>
        <div class="action-bar-wrap" id="action-bar"></div>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <script src="icons.js"></script>
    <script src="app.js"></script>
  </body>
</html>
